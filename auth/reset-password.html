<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danish Flow – Új jelszó</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; text-align: center; }
    p { font-size: 0.95rem; color: #555; line-height: 1.5; text-align: center; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 14px; text-align: center; font-size: 0.9rem; }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Új jelszó / New password</h1>
    <p id="hint">Add meg az új jelszavad (legalább 6 karakter).</p>

    <div id="form">
      <label for="pw">Jelszó</label>
      <input id="pw" type="password" minlength="6" autocomplete="new-password" />
      <label for="pw2">Jelszó újra</label>
      <input id="pw2" type="password" minlength="6" autocomplete="new-password" />
      <button type="button" id="save">Mentés / Save</button>
    </div>

    <p id="done" class="msg ok hidden">A jelszavad frissítve. Nyisd meg az appot és jelentkezz be.<br /><span class="en">Password updated. Open the app and log in.</span></p>
    <p id="error" class="msg err hidden"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://ugaqzfsrseyohsdazgmh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnYXF6ZnNyc2V5b2hzZGF6Z21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTE0MzgsImV4cCI6MjA5NDg2NzQzOH0.TEAjjJ0O38TFIvX-HOuNVw0mYEa4ioAmXWTh6C_huWM';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('form');
    const done = document.getElementById('done');
    const errorEl = document.getElementById('error');
    const hint = document.getElementById('hint');
    const saveBtn = document.getElementById('save');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    async function initSessionFromHash() {
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');
      if (!access_token || !refresh_token) {
        showError('Érvénytelen vagy lejárt link. Kérj új jelszó-visszaállítást az appban.');
        form.classList.add('hidden');
        hint.classList.add('hidden');
        return false;
      }
      const { error } = await client.auth.setSession({ access_token, refresh_token });
      if (error) {
        showError(error.message);
        form.classList.add('hidden');
        return false;
      }
      return true;
    }

    saveBtn.addEventListener('click', async () => {
      errorEl.classList.add('hidden');
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw.length < 6) {
        showError('Legalább 6 karakter / At least 6 characters');
        return;
      }
      if (pw !== pw2) {
        showError('A két jelszó nem egyezik / Passwords do not match');
        return;
      }
      saveBtn.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw });
      if (error) {
        showError(error.message);
        saveBtn.disabled = false;
        return;
      }
      form.classList.add('hidden');
      hint.classList.add('hidden');
      done.classList.remove('hidden');
    });

    initSessionFromHash();
  </script>
</body>
</html>

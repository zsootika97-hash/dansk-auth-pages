<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danish Flow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #e8f0fe 0%, #f5f7fa 45%, #fff 100%);
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.12);
    }
    .brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2563eb;
      margin-bottom: 20px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #15803d;
      font-size: 2rem;
      line-height: 64px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #1a1a2e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Danish Flow</div>
    <div class="icon">✓</div>
    <h1>Sikeres regisztráció!</h1>
  </div>

  <script>
    const SUPABASE_URL = 'https://ugaqzfsrseyohsdazgmh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnYXp6ZnNyc2V5b2hzZGF6Z21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTE0MzgsImV4cCI6MjA5NDg2NzQzOH0.TEAjjJ0O38TFIvX-HOuNVw0mYEa4ioAmXWTh6C_huWM';

    (async function () {
      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const params = new URLSearchParams(window.location.search);
        const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
        const hashParams = new URLSearchParams(hash);

        const access_token = hashParams.get('access_token');
        const refresh_token = hashParams.get('refresh_token');
        if (access_token && refresh_token) {
          await client.auth.setSession({ access_token, refresh_token });
          return;
        }

        const token_hash = params.get('token_hash');
        const type = params.get('type') || hashParams.get('type');
        if (token_hash && type) {
          await client.auth.verifyOtp({ token_hash, type });
        }
      } catch (_) {
        /* A link már feldolgozva lehet – a felhasználónak csak a siker üzenet látszik. */
      }
    })();
  </script>
</body>
</html>
